<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Task — TaskForge</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="app-shell edit-shell">
        <header>
            <div>
                <h1>Edit Task</h1>
                <p>Update task details, deadline, priority, or notes.</p>
            </div>
            <a href="{{ url_for('index') }}" class="secondary-button">Back to Home</a>
        </header>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <div class="flash">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <article class="card card-form">
            <form action="{{ url_for('edit_task', task_id=task.id) }}" method="post">
                <label for="title">Title *</label>
                <input id="title" name="title" type="text" value="{{ task.title }}" required />

                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    <option value="High" {% if task.priority == 'High' %}selected{% endif %}>High</option>
                    <option value="Medium" {% if task.priority == 'Medium' %}selected{% endif %}>Medium</option>
                    <option value="Low" {% if task.priority == 'Low' %}selected{% endif %}>Low</option>
                </select>

                <label for="deadline">Deadline</label>
                <input id="deadline" name="deadline" type="date" value="{{ task.deadline or '' }}" />

                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="5">{{ task.notes or '' }}</textarea>

                <button type="submit" class="primary-button">Save Changes</button>
            </form>
        </article>
    </div>
</body>
</html>
